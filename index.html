<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen DM</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        height: 100vh;
        color: #111;
    }

    .app {
        display: flex;
        height: 100vh;
        width: 100%;
        background: #fff;
    }

    /* 왼쪽 사이드바 */
    .sidebar {
        width: 360px;
        border-right: 1px solid #dbdbdb;
        display: flex;
        flex-direction: column;
        background: #fff;
    }

    .sidebar-top {
        height: 75px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #efefef;
    }

    .sidebar-title {
        font-size: 20px;
        font-weight: 700;
    }

    .new-message {
        font-size: 24px;
        cursor: pointer;
    }

    .search-area {
        padding: 12px 16px;
    }

    .search-box {
        background: #efefef;
        border-radius: 10px;
        padding: 11px 14px;
        color: #777;
        font-size: 14px;
    }

    .note-row {
        padding: 14px 18px;
        border-bottom: 1px solid #f4f4f4;
    }

    .note-profile {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(
            135deg,
            #f9ce34,
            #ee2a7b,
            #6228d7
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 20px;
    }

    .chat-list {
        flex: 1;
        overflow-y: auto;
    }

    .chat-item {
        display: flex;
        align-items: center;
        padding: 12px 18px;
        gap: 12px;
        cursor: pointer;
        transition: 0.15s;
    }

    .chat-item:hover {
        background: #fafafa;
    }

    .chat-info {
        flex: 1;
        min-width: 0;
    }

    .chat-name {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .chat-preview {
        font-size: 13px;
        color: #777;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chat-time {
        font-size: 12px;
        color: #999;
    }

    /* 오른쪽 채팅 */
    .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
    }

    .chat-header {
        height: 75px;
        border-bottom: 1px solid #dbdbdb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
    }

    .chat-user-header {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-user-header .avatar {
        width: 42px;
        height: 42px;
        font-size: 16px;
    }

    .header-name {
        font-weight: 600;
        font-size: 15px;
    }

    .header-status {
        font-size: 12px;
        color: #777;
        margin-top: 3px;
    }

    .header-actions {
        display: flex;
        gap: 20px;
        font-size: 22px;
    }

    .header-actions span {
        cursor: pointer;
    }

    .messages {
        flex: 1;
        padding: 24px 28px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #fff;
    }

    .date-label {
        text-align: center;
        font-size: 12px;
        color: #999;
        margin: 6px 0 12px 0;
    }

    .message-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .mini-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(
            135deg,
            #f9ce34,
            #ee2a7b,
            #6228d7
        );
        color: white;
        font-size: 11px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .message {
        max-width: 58%;
        padding: 10px 14px;
        border-radius: 22px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .ai-message {
        background: #efefef;
        color: #111;
        border-bottom-left-radius: 6px;
    }

    .user-message {
        background: #3797f0;
        color: #fff;
        border-bottom-right-radius: 6px;
    }

    .loading {
        color: #777;
        font-style: italic;
    }

    .input-area {
        padding: 14px 20px 20px;
        background: #fff;
    }

    .input-box {
        border: 1px solid #dbdbdb;
        border-radius: 28px;
        height: 50px;
        display: flex;
        align-items: center;
        padding: 0 10px 0 16px;
        gap: 10px;
    }

    .input-icon {
        font-size: 22px;
        cursor: pointer;
    }

    .input-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 14px;
        background: transparent;
    }

    .send-btn {
        border: none;
        background: transparent;
        color: #0095f6;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        padding: 8px;
    }

    .send-btn:hover {
        color: #0077c8;
    }

    /* 모바일 */
    @media (max-width: 800px) {
        .sidebar {
            display: none;
        }

        .message {
            max-width: 78%;
        }

        .messages {
            padding: 18px 14px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <div class="sidebar">

        <div class="sidebar-top">
            <div class="sidebar-title">mococo_user</div>
            <div class="new-message">✎</div>
        </div>

        <div class="search-area">
            <div class="search-box">검색</div>
        </div>

        <div class="note-row">
            <div class="note-profile">
                <div class="avatar">Q</div>

                <div>
                    <div style="font-weight:600;">Qwen AI</div>
                    <div style="font-size:12px; color:#888; margin-top:4px;">
                        무엇이든 물어보세요
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-list">

            <div class="chat-item">

                <div class="avatar">Q</div>

                <div class="chat-info">
                    <div class="chat-name">Qwen AI</div>
                    <div class="chat-preview" id="lastMessage">
                        새 메시지를 보내보세요
                    </div>
                </div>

                <div class="chat-time">지금</div>

            </div>

        </div>

    </div>


    <div class="chat-area">

        <div class="chat-header">

            <div class="chat-user-header">

                <div class="avatar">Q</div>

                <div>
                    <div class="header-name">Qwen AI</div>
                    <div class="header-status">
                        온라인 · 로컬 AI
                    </div>
                </div>

            </div>

            <div class="header-actions">
                <span>☎</span>
                <span>◉</span>
                <span>ⓘ</span>
            </div>

        </div>


        <div class="messages" id="messages">

            <div class="date-label">
                오늘
            </div>

        </div>


        <div class="input-area">

            <div class="input-box">

                <div class="input-icon">☺</div>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="메시지 보내기..."
                    autocomplete="off"
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                >
                    보내기
                </button>

            </div>

        </div>

    </div>

</div>


<script>

const input =
    document.getElementById("messageInput");

const messages =
    document.getElementById("messages");

const lastMessage =
    document.getElementById("lastMessage");


let chatHistory =
    JSON.parse(
        localStorage.getItem("qwenChatHistory")
    ) || [];


if (chatHistory.length === 0) {

    chatHistory.push({
        role: "system",
        content:
            "당신은 친절하고 자연스럽게 대화하는 한국어 AI 비서입니다. " +
            "사용자의 이전 대화를 참고해서 문맥을 이어가세요."
    });

    saveHistory();

    addAIMessage(
        "안녕하세요. 무엇을 도와드릴까요?"
    );

}
else {
    loadMessages();
}


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


async function sendMessage() {

    const text = input.value.trim();

    if (!text) {
        return;
    }

    addUserMessage(text);

    chatHistory.push({
        role: "user",
        content: text
    });

    saveHistory();

    lastMessage.innerText = text;

    input.value = "";


    const loadingRow =
        document.createElement("div");

    loadingRow.className =
        "message-row";

    loadingRow.innerHTML = `
        <div class="mini-avatar">Q</div>
        <div class="message ai-message loading">
            답변 작성 중...
        </div>
    `;

    messages.appendChild(loadingRow);

    scrollBottom();


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            messages:
                                chatHistory
                        })
                }
            );


        if (!response.ok) {
            throw new Error("서버 오류");
        }


        const data =
            await response.json();


        loadingRow.remove();


        addAIMessage(
            data.reply
        );


        chatHistory.push({
            role: "assistant",
            content: data.reply
        });


        saveHistory();


        lastMessage.innerText =
            data.reply;

    }

    catch (error) {

        loadingRow.remove();

        addAIMessage(
            "Qwen 서버에 연결할 수 없습니다."
        );

        console.error(error);

    }
}


function addUserMessage(text) {

    const row =
        document.createElement("div");

    row.className =
        "message-row user";

    row.innerHTML = `
        <div class="message user-message"></div>
    `;

    row.querySelector(".message").innerText =
        text;

    messages.appendChild(row);

    scrollBottom();
}


function addAIMessage(text) {

    const row =
        document.createElement("div");

    row.className =
        "message-row";

    row.innerHTML = `
        <div class="mini-avatar">Q</div>
        <div class="message ai-message"></div>
    `;

    row.querySelector(".message").innerText =
        text;

    messages.appendChild(row);

    scrollBottom();
}


function saveHistory() {

    localStorage.setItem(
        "qwenChatHistory",
        JSON.stringify(chatHistory)
    );

}


function loadMessages() {

    messages.innerHTML =
        `<div class="date-label">오늘</div>`;


    for (const message of chatHistory) {

        if (message.role === "user") {
            addUserMessage(
                message.content
            );
        }

        else if (
            message.role === "assistant"
        ) {
            addAIMessage(
                message.content
            );
        }

    }


    const visibleHistory =
        chatHistory.filter(
            m =>
                m.role === "user" ||
                m.role === "assistant"
        );


    if (visibleHistory.length > 0) {

        lastMessage.innerText =
            visibleHistory[
                visibleHistory.length - 1
            ].content;

    }

}


function scrollBottom() {

    messages.scrollTop =
        messages.scrollHeight;

}

</script>

</body>
</html>
